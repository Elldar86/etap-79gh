function buildStages(o){const out=[];let start=o.start1||D.stages[0][0];for(let n=1;n<=48;n++){const end=(o.ends&&o.ends[n])||D.stages[n-1][1];out.push([start,end]);start=addDays(end,1)}return out}
const stageDates=n=>stageList()[n-1];
function stageOf(iso){const L=stageList();for(let i=0;i<48;i++){if(iso>=L[i][0]&&iso<=L[i][1])return i+1}return null}
function stageDays(n){const [a,b]=stageDates(n);const r=[];for(let d=a;d<=b;d=addDays(d,1))r.push(d);return r}
function deadlines(n){const end=stageDates(n)[1];const eis=addWork(end,(n===24||n===48)?5:10);const sign=addWork(eis,10);const pay=addWork(sign,7);return{end,eis,sign,pay}}

const money=x=>x==null||isNaN(x)?"—":Number(x).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₽";
const mln=x=>(x/1e6).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1})+" млн ₽";
const pct=x=>x==null||x===""||isNaN(x)?"—":(x*100).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
function parseNum(s){if(s==null)return null;s=String(s).replace(/[\s ]/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?v:NaN}

/* ---------- хранилище: общая база claude.ai или память телефона ---------- */
const COLS=["facts","corr","stages","events","settings","rev","pplan"];
const LS_KEY="79gh-app-v1";
const store={mode:"local",db:null,data:{facts:{},corr:{},stages:{},events:{},settings:{},rev:{},pplan:{}}};
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(j)COLS.forEach(c=>store.data[c]=j[c]||{})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(store.data))}catch(e){}}
function setSync(t){$("#sync").textContent=t}
async function initStore(){
  loadLocal(); setSync("на телефоне"); render();
  let db=null;
  try{ if(window.claude&&window.claude.use) db=await window.claude.use("db"); }catch(e){db=null}
  if(!db){setSync("на телефоне");return}
  store.db=db; store.mode="db"; setSync("синхронизация…");
  let pending=COLS.length;
  const timer=setTimeout(()=>{if(pending>0)setSync("нет связи")},10000);
  COLS.forEach(c=>{
    let first=true;

      const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});

/* ---------- расчёты (как в книге Excel) ---------- */
function priceOf(p){const s=S().price;const x=PI[p];return s==="как в Прил. 4 полностью"?x.pfull:s==="2 знака"?r2(x.p4):x.p4}
function factRow(iso,p){const f=store.data.facts[iso];return f&&f.rows&&f.rows[p]||null}
function daily(iso,p){
  const f=factRow(iso,p)||{};const sc=sched(p,iso);
  const has=k=>f[k]!=null&&f[k]!=="";
  const tripsPlan=has("tp")?f.tp:sc[0], kmPlan=has("kp")?f.kp:sc[1];
  const irr=has("irr")?f.irr:null;
  const reg=(irr!=null&&tripsPlan)?1-irr/tripsPlan:null;
  return{tripsPlan,kmPlan,schedKm:sc[1],schedTrips:sc[0],tf:has("tf")?f.tf:null,kf:has("kf")?f.kf:null,hp:has("hp")?f.hp:null,hf:has("hf")?f.hf:null,irr,reg,note:f.note||"",planSrc:has("kp")?"АСДУ":"Прил. 1"}
}
function corrOf(n,p){return store.data.corr["s"+n+"-p"+PI[p].i]||null}
function stageCalc(n){
  const days=stageDays(n), st=store.data.stages["s"+n]||{}, set=S();
  const rows=POS.map(p=>{
    const D3=(D.plan[n]&&D.plan[n][p])||0; const c=corrOf(n,p); const E=c&&c.km!=null?c.km:null; const F=E!=null?E:D3;
    let G=0,H=0,R=0,Sf=0,U=0,V=0,cnt=0,X=0;
    days.forEach(d=>{const x=daily(d,p);G+=x.schedKm;R+=x.tripsPlan||0;if(x.kf!=null){H+=x.kf;cnt++}Sf+=x.tf||0;U+=x.hp||0;V+=x.hf||0;if(x.reg!=null&&x.reg<set.norm)X++});
    return{p,D:r1(D3),E,F:r1(F),G:r1(G),H:r1(H),R,S:Sf,U:r1(U),V:r1(V),W:days.length-cnt,X,M:st.lf&&st.lf[p]!=null&&st.lf[p]!==""?st.lf[p]:null,O:priceOf(p)};
  });
  const F22=rows.reduce((a,r)=>a+r.F,0), H22=rows.reduce((a,r)=>a+r.H,0);
  rows.forEach(r=>{
    r.I=r1(r.H-r.F); r.J=r.F?r.H/r.F:null; r.K=r1(Math.max(0,r.H-r.F));
    r.L=set.limit==="без ограничения"?r.H:set.limit==="по этапу в целом"?(H22<=F22?r.H:r1(r.H*F22/H22)):Math.min(r.H,r.F);
    r.N=r.M!=null?r.M:r.L; r.P=r2(r.O*r.N); r.Q=r2(Math.max(0,r.H-r.N)*r.O); r.T=r.R?r.S/r.R:null;
  });
  const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const tot={D:r1(sum("D")),F:r1(F22),G:r1(sum("G")),H:r1(H22),I:r1(sum("I")),K:r1(sum("K")),L:r1(sum("L")),N:r1(sum("N")),P:r2(sum("P")),Q:r2(sum("Q")),R:sum("R"),S:sum("S"),U:r1(sum("U")),V:r1(sum("V")),W:sum("W"),X:sum("X")};
  tot.J=tot.F?tot.H/tot.F:null; tot.T=tot.R?tot.S/tot.R:null;
  const fines=Number(st.fines)||0;
  return{n,days,rows,tot,fines,toPay:r2(tot.P-fines),check3:r1(D.tot[n]-tot.D)===0,check1:r1(tot.G-tot.D),st};
}
function form19(iso){
  const set=S();const out=[];
  const agg=ps=>{const o={tp:0,tf:0,kp:0,kf:0,hp:0,hf:0,anyF:false};ps.forEach(p=>{const x=daily(iso,p);o.tp+=x.tripsPlan||0;o.kp+=x.kmPlan||0;o.tf+=x.tf||0;o.kf+=x.kf||0;o.hp+=x.hp||0;o.hf+=x.hf||0;if(x.kf!=null)o.anyF=true});o.kp=r1(o.kp);o.kf=r1(o.kf);o.hp=r1(o.hp);o.hf=r1(o.hf);return o};
  ROUTES.forEach(r=>{
    if(r==="18"){out.push(Object.assign({r:"18"},agg(["18 ДТ","18 КПГ"])));
      if(set.form18!=="одной строкой"){out.push(Object.assign({r:"   в т.ч. ДТ",sub:true},agg(["18 ДТ"])));out.push(Object.assign({r:"   в т.ч. КПГ",sub:true},agg(["18 КПГ"])))}}
    else out.push(Object.assign({r},agg([r])));
  });
  const t={r:"Итого:",tp:0,tf:0,kp:0,kf:0,hp:0,hf:0};out.filter(x=>!x.sub).forEach(x=>["tp","tf","kp","kf","hp","hf"].forEach(k=>t[k]+=x[k]));["kp","kf","hp","hf"].forEach(k=>t[k]=r1(t[k]));
  return{rows:out,tot:t};
}
const dayStatus=iso=>{let c=0;POS.forEach(p=>{if(daily(iso,p).kf!=null)c++});const need=POS.filter(p=>sched(p,iso)[1]>0||daily(iso,p).kf!=null).length;return c===0?"miss":c>=need?"ok":"part"};

  weather:{t:"Погода, пробки, ремонт дорог",n:0,what:"Оформить двусторонний акт о регулярности."}};
function reminders(){
  const today=todayIso(), out=[];
  if(today<START){out.push({lvl:"",when:"через "+diffDays(today,START)+" дн.",t:"Старт работ 01.12.2026",d:"С 02.12 каждый день вносить данные АСДУ за прошедшие сутки. Документ о приёмке этапа 1 сдать в ЕИС до "+ru(deadlines(1).eis)+".",sort:START})}
  const y=addDays(today,-1);
  if(y>=START&&y<=END){
    const cur=stageOf(y)||curStage();const miss=stageDays(cur).filter(d=>d<=y&&dayStatus(d)!=="ok");
    if(miss.length)out.push({lvl:miss.includes(y)?"bad":"warn",when:"этап "+cur,t:"Не внесены данные АСДУ: "+miss.length+" сут.",d:miss.slice(-6).map(ruShort).join(", ")+(miss.length>6?" и раньше":""),go:"#entry",goDate:miss[miss.length-1],sort:y});
    else out.push({lvl:"good",when:"этап "+cur,t:"Данные АСДУ внесены по "+ru(y),d:"Форма Прил. 19 готова на вкладке «Ввод».",sort:"9"});
  }
  for(let n=1;n<=48;n++){
    const dl=deadlines(n), st=store.data.stages["s"+n]||{};
    if(today<=dl.end&&today>=stageDates(n)[0]){ /* текущий этап */ }
    if(!st.eis&&today>dl.end&&today<=addDays(dl.eis,20)){const left=diffDays(today,dl.eis);
      out.push({lvl:left<0?"bad":left<=3?"warn":"",when:left<0?"просрочено на "+(-left)+" дн.":left===0?"сегодня":"через "+left+" дн.",t:"Этап "+n+": документ о приёмке в ЕИС до "+ru(dl.eis),d:"Акт (прил. 6), отчёты прил. 12 и 20. Цифры для акта — вкладка «Этап».",go:"#stage",goStage:n,sort:dl.eis})}
    if(today>=stageDates(n)[0]&&today<=dl.end&&diffDays(today,dl.end)<=3){out.push({lvl:"",when:"через "+diffDays(today,dl.end)+" дн.",t:"Этап "+n+" заканчивается "+ru(dl.end),d:"После окончания — свод пробега и документ в ЕИС до "+ru(dl.eis)+".",go:"#stage",goStage:n,sort:dl.end})}
    if(st.eis&&!st.paid&&today>=dl.sign&&today<=addDays(dl.pay,30)){const left=diffDays(today,dl.pay);
      out.push({lvl:left<0?"bad":"",when:left<0?"просрочено на "+(-left)+" дн.":"до "+ru(dl.pay),t:"Этап "+n+": ждём оплату",d:"Крайний срок оплаты по контракту — "+ru(dl.pay)+". При просрочке — пеня 1/300 ключевой ставки в день (п. 9.1).",go:"#stage",goStage:n,sort:dl.pay})}
  }
  Object.entries(store.data.events).forEach(([id,e])=>{
    if(e.done)return;const k=KIND[e.kind]||KIND.nav;const due=k.n?addWork(e.date,k.n):null;const left=due?diffDays(today,due):null;
    out.push({lvl:due&&left<0?"bad":"warn",when:due?(left<0?"просрочено":left===0?"сегодня":"до "+ru(due)):"",t:"Сбой "+ru(e.date)+", маршрут "+e.route+": "+k.t.toLowerCase(),d:k.what,go:"#more",sort:due||e.date,ev:id});
  });
  { const pm=addDays(today.slice(0,8)+"01",-1).slice(0,7);
    if(MONTHS.includes(pm)&&diffDays(eom(pm),today)<=15&&!Object.keys(store.data.rev).some(d=>d.startsWith(pm)))
      out.push({lvl:"warn",when:"за "+monthName(pm),t:"Нет выручки АСОП за "+monthName(pm),d:"Нужна для отчётов Прил. 12 и 20. Загрузите список от оператора АСОП.",go:"#entry",goMode:"rev",goDate:eom(pm),sort:eom(pm)}) }
  const rank={bad:0,warn:1,"":2,good:3};
  return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]||String(a.sort).localeCompare(String(b.sort)));
}

function checkCard(card){
  const p=card.dataset.pos;const g=k=>parseNum(card.querySelector(`[data-k="${k}"]`).value);
  const sc=sched(p,entryDate);const tp=g("tp")??sc[0], kp=g("kp")??sc[1], kf=g("kf"), irr=g("irr");
  const msgs=[];let lvl="";
  card.querySelectorAll("input").forEach(i=>{i.classList.remove("warnf","badf");if(i.dataset.k!=="note"&&isNaN(parseNum(i.value))){i.classList.add("badf");msgs.push("не число");lvl="bad"}});
  if(kf!=null&&!isNaN(kf)){const pr=kp?kf/kp:null;
    if(kp&&kf>kp){card.querySelector('[data-k="kf"]').classList.add("warnf");msgs.push("факт больше плана на "+fmt(r1(kf-kp))+" км");lvl=lvl||"warn"}
    else if(pr!=null&&pr<1){msgs.push("выполнение "+pct(pr)+", недобег "+fmt(r1(kp-kf))+" км");lvl=lvl||(pr<0.96?"warn":"")}}
  if(irr!=null&&!isNaN(irr)&&tp){const reg=1-irr/tp;if(reg<S().norm){msgs.push("регулярность "+pct(reg)+" ниже нормы");lvl="bad";card.querySelector('[data-k="irr"]').classList.add("badf")}}
  const st=card.querySelector("[data-st]");
  st.className="pill "+(kf==null?"":lvl||"good");st.textContent=kf==null?(sc[1]?"нет данных":"нет рейсов"):lvl==="bad"?"проблема":lvl==="warn"?"внимание":"ок";
  card.querySelector("[data-msg]").textContent=msgs.join(" · ");
  card.querySelector("[data-msg]").style.color=lvl==="bad"?"var(--bad)":lvl==="warn"?"var(--warn)":"var(--muted)";
}
async function saveDay(){
  const rows={};let bad=false;
  document.querySelectorAll("#cards .pos").forEach(card=>{const p=card.dataset.pos;const o={};let any=false;
    card.querySelectorAll("input").forEach(i=>{const k=i.dataset.k;if(k==="note"){if(i.value.trim()){o.note=i.value.trim();any=true}return}const v=parseNum(i.value);if(v===null)return;if(isNaN(v)){bad=true;return}o[k]=v;any=true});
    if(any)rows[p]=o});
  if(bad){toast("Есть поля не с числом — исправьте красные поля");return}
  const iso=entryDate;

  entryDirty=false;toast("Сохранено: "+ru(iso));render();
}

    const file=new File([blob],filename,{type:blob.type});
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return true}catch(e){if(e&&e.name==="AbortError")return false}}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);return true}
  catch(e){toast("Файл не сохранён: "+(e&&e.message||"ошибка"));return false}
}

let pasteParsed=null;
function parseDate(s){s=String(s).trim();let m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];return null}
function parsePaste(rows){
  const out=[];const errs=[];const seen={};
  rows.forEach((c,i)=>{if(!c.some(x=>String(x??"").trim()))return;c=c.map(x=>x==null?"":x);
    const iso=parseDate(c[0]||"");if(!iso){if(i>4&&String(c[1]).trim())errs.push("стр. "+(i+1)+": дата не распознана");return}
    if(iso<START||iso>END){errs.push("стр. "+(i+1)+": дата вне срока контракта");return}
    const r=String(c[1]||"").trim().toUpperCase().replace("A","А");if(!ROUTES.includes(r)){errs.push("стр. "+(i+1)+": нет такого маршрута «"+(c[1]||"")+"»");return}
    let p=r;if(r==="18"){const fu=String(c[2]||"").toLowerCase();if(!fu.trim()){errs.push("стр. "+(i+1)+": 18 — укажите ДТ или КПГ");return}p=/кпг|газ/.test(fu)?"18 КПГ":"18 ДТ"}
    const key=iso+"|"+p;if(seen[key]){errs.push("стр. "+(i+1)+": дубль "+ru(iso)+" "+p);return}seen[key]=1;
    const o={};[["tp",3],["tf",4],["kp",5],["kf",6],["hp",7],["hf",8],["irr",9]].forEach(([k,j])=>{const v=parseNum(c[j]);if(v!=null&&!isNaN(v))o[k]=v});
    out.push({iso,p,o})});
  pasteParsed=out;
  $("#pasteOut").innerHTML=`<p>${out.length} строк готово${errs.length?`, ${errs.length} с ошибками:`:"."}</p>${errs.length?`<p style="color:var(--bad)">${errs.slice(0,10).map(esc).join("<br>")}${errs.length>10?"<br>…":""}</p>`:""}${out.length?`<button class="primary" data-act="applyPaste">Сохранить ${out.length} строк</button>`:""}`;
}
async function applyPaste(){

async function toPdf(m){
  await Promise.all([loadLib("jspdf"),loadLib("h2c")]);try{await document.fonts.ready}catch(e){}
  const land=m.orient==="landscape";const W=land?1123:794,H=land?794:1123;const CW=W-88;
  const host=document.createElement("div");host.className="paper-host";document.body.appendChild(host);
  const pages=[];const mk=first=>{const p=document.createElement("div");p.className="paper";p.style.width=W+"px";p.style.height=H+"px";p.innerHTML=`${paperHead(m,first)}<div class="pg-body"></div><div class="pf"><span>${esc(hdrOn()?S().company+" · контракт № 79-ГХ":"Контракт № 79-ГХ")}</span><span class="pn"></span></div>`;host.appendChild(p);pages.push(p);return p.querySelector(".pg-body")};
  const over=body=>body.scrollHeight>body.clientHeight+1;
  try{
    let body=mk(true);
    const queue=m.blocks.map(b=>{const d=document.createElement("div");d.innerHTML=blockHtml(b,true,PAL_EXPORT,CW);return d.firstElementChild}).filter(Boolean);
    let guard=0;
    while(queue.length&&guard++<500){const el=queue.shift();body.appendChild(el);if(!over(body))continue;
      const alone=body.children.length===1;const tb=el.querySelector("tbody");
      if(tb&&tb.rows.length>1){const rest=el.cloneNode(true);const rtb=rest.querySelector("tbody");rtb.innerHTML="";const cap=rest.querySelector("h3");if(cap)cap.textContent+=" (продолжение)";
        while(over(body)&&tb.rows.length>1)rtb.insertBefore(tb.rows[tb.rows.length-1],rtb.firstChild);
        if(!alone&&tb.rows.length<3){while(rtb.rows.length)tb.appendChild(rtb.rows[0]);el.remove();body=mk(false);queue.unshift(el);continue}
        if(rtb.rows.length){body=mk(false);queue.unshift(rest)}continue}
      if(!alone){el.remove();body=mk(false);queue.unshift(el)}}
    pages.forEach((p,i)=>p.querySelector(".pn").textContent="стр. "+(i+1)+" из "+pages.length);
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:land?"landscape":"portrait",unit:"pt",format:"a4",compress:true});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){const c=await window.html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false,width:W,height:H,windowWidth:W});
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,ph)}
    return pdf.output("blob")}
  finally{host.remove()}}

 rev:["Раз в сутки или раз в месяц получите от оператора АСОП выгрузку: выручка по разовым и многоразовым билетам, за багаж и число пассажиров по каждому маршруту.","Приведите её к 6 столбцам: Дата, № маршрута, Разовые, Многоразовые, Багаж, Пассажиры. Тот же список вставляется на лист «Выручка АСОП» таблицы.","Выберите файл или вставьте строки → «Проверить строки» → «Сохранить». Строки с ошибками приложение покажет и не сохранит.","Проверьте «Итого за месяц» внизу: сумма должна совпасть с отчётом оператора.","Готовые формы — «Отчёты → Прил. 12» и «Прил. 20»."],
 f12:["Сначала загрузите выручку АСОП за месяц: «Ввод → Выручка АСОП».","Выберите месяц. Даты «с/по» ставятся сами, их можно поправить, если заказчик просит другой период.","Проверьте суммы по маршрутам и итог. Сумму прописью впишите от руки после печати.","Скачайте PDF или Word, подпишите и направьте заказчику вместе с документами этапа."],
 f20:["Нужны данные АСДУ за все дни месяца («Ввод → АСДУ») и выручка АСОП с пассажирами.","Графу 18 «план пассажиров» заполните ниже: вручную по маршрутам или списком «Месяц | маршрут | план».","Графы 4–11 и план км/рейсов приложение берёт из Прил. 1 и 3 само.","Выберите месяц, проверьте итоги и скачайте PDF или Word (лист альбомный)."],
 f19:["Каждое утро внесите или загрузите данные АСДУ за прошедшие сутки («Ввод → АСДУ»).","Выберите дату и скачайте форму: PDF или Word — для письма заказчику, Excel — для таблицы."],
 stage:["После окончания этапа проверьте, что все дни зелёные на вкладке «Этап».","Внесите штрафы и Lф по решению комиссии, если они есть.","Скачайте свод: из него берутся цифры для акта (Прил. 6) и документа в ЕИС."],
 tot:["Выберите вид периода (неделя, месяц, квартал, полугодие, год, весь контракт или свои даты) и любую дату внутри него. Стрелки ‹ › листают периоды.","Шаг динамики подбирается сам, его можно сменить.","Для руководства скачайте PDF: на каждом листе шапка с названием компании, периодом и датой формирования.","Стоимость пробега — оценка (факт × цена). Точная сумма к оплате — на вкладке «Этап»."]};
function howTo(k){const L=HOWTO[k];return L?`<div class="card" style="padding-block:0;margin-top:10px"><details><summary>Как заполнять</summary><div class="body"><ol class="steps small">${L.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></details></div>`:""}

let glQ="";
function modeSeg(){return `<div class="seg" role="group" aria-label="Что вносим" style="margin-top:14px"><button data-act="emode" data-m="asdu" aria-pressed="${entryMode==="asdu"}">АСДУ: рейсы и пробег</button><button data-act="emode" data-m="rev" aria-pressed="${entryMode==="rev"}">Выручка АСОП</button></div>`}
/* ---------- события ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="exp"){const m=repModel(b.dataset.kind);exportRep(m,b.dataset.fmt,b)}
  else if(a==="repKind"){rep.kind=b.dataset.k;render()}
  else if(a==="goRep"){rep.kind=b.dataset.k;if(b.dataset.ym){rep.ym=b.dataset.ym;rep.a=rep.b=null}location.hash="rep"}
  else if(a==="emode"){entryMode=b.dataset.m;render();window.scrollTo(0,0)}
  else if(a==="revShift"){revDate=clampDate(addDays(revDate,+b.dataset.n));render()}
  else if(a==="revEom"){revDate=eom(revDate.slice(0,7));render()}
  else if(a==="saveRev")saveRev();
  else if(a==="revParse")revParse(textRows($("#revPaste").value));
  else if(a==="revApply")revApply();
  else if(a==="ppParse")ppParse(textRows($("#ppPaste").value));
  else if(a==="ppApply")ppApply();
  else if(a==="ppSave"){const rows={};let bad=false;document.querySelectorAll("#ppBox input").forEach(i=>{const v=parseNum(i.value);if(v==null)return;if(isNaN(v)){bad=true;return}rows[i.dataset.rt]=v});if(bad){toast("План пассажиров — числа");return}await put("pplan",b.dataset.ym,{rows});toast("План пассажиров сохранён");render()}
  else if(a==="perShift"){const n=+b.dataset.n;const [pa,pb]=periodOf(rep.type,rep.anchor);rep.anchor=clampDate(n<0?addDays(pa,-1):addDays(pb,1));render()}
  else if(a==="goEntry"){entryMode="asdu";if(view==="entry"&&entryDirty&&!b.dataset.force){}entryDate=b.dataset.date;location.hash="entry";if(view==="entry")render()}
  else if(a==="go"){if(b.dataset.mode){entryMode=b.dataset.mode;if(b.dataset.date)revDate=b.dataset.date}else{if(b.dataset.date)entryDate=b.dataset.date;if(b.dataset.href==="#entry")entryMode="asdu"}if(b.dataset.stage)stageSel=+b.dataset.stage;location.hash=b.dataset.href.slice(1)}
  else if(a==="goEvent"){location.hash="more"}
  else if(a==="dayShift"){entryDate=clampDate(addDays(entryDate,+b.dataset.n));render()}
  else if(a==="saveDay")saveDay();
  else if(a==="copy19"){const t=form19Tsv(entryDate);try{await navigator.clipboard.writeText(t);toast("Форма скопирована")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Форма скопирована")}catch(_){toast("Не удалось скопировать")}ta.remove()}}
  else if(a==="xlsx19"){const X=xl();if(!X)return;const wb=X.utils.book_new();X.utils.book_append_sheet(wb,sheet19(entryDate),"Прил19 "+ruShort(entryDate));saveFile(fname("Прил19 79-ГХ "+ru(entryDate),"Pril19_79GH_"+entryDate)+".xlsx",wbBlob(wb))}
  else if(a==="xlsxStage"){const X=xl();if(!X)return;const wb=X.utils.book_new();X.utils.book_append_sheet(wb,sheetStage(stageSel),"Этап "+stageSel);saveFile(fname("Этап "+stageSel+" 79-ГХ","Etap_"+stageSel+"_79GH")+".xlsx",wbBlob(wb))}
  else if(a==="xlsxAll"){const X=xl();if(!X)return;const wb=X.utils.book_new();X.utils.book_append_sheet(wb,sheetAsdu(),"Выгрузка АСДУ");X.utils.book_append_sheet(wb,sheetRev(),"Выручка АСОП");X.utils.book_append_sheet(wb,sheetStage(curStage()),"Этап "+curStage());X.utils.book_append_sheet(wb,sheetCorr(),"Корректировки плана");X.utils.book_append_sheet(wb,sheetEvents(),"Сбои");saveFile(fname("79-ГХ данные "+ru(todayIso()),"79GH_dannye_"+todayIso())+".xlsx",wbBlob(wb))}
  else if(a==="backup"){saveFile(fname("79-ГХ резервная копия "+ru(todayIso()),"79GH_backup_"+todayIso())+".json",JSON.stringify({app:"79gh",v:2,saved:new Date().toISOString(),data:store.data},null,1))}
  else if(a==="set"){const s=Object.assign({},S(),{[b.dataset.key]:b.dataset.val});await put("settings","main",s);render()}
  else if(a==="addEvent"){const e={date:$("#evDate").value,route:$("#evRoute").value,kind:$("#evKind").value,text:$("#evText").value.trim(),done:false};if(!e.date){toast("Укажите дату");return}await put("events","e"+Date.now(),e);toast("Сбой записан, срок — в напоминаниях");render()}
  else if(a==="evDone"){const e=store.data.events[b.dataset.id];if(e){await put("events",b.dataset.id,Object.assign({},e,{done:true}));render()}}
  else if(a==="evDel"){await del("events",b.dataset.id);render()}
  else if(a==="addCorr"){const st=+$("#crStage").value,p=$("#crPos").value,km=parseNum($("#crKm").value);if(km==null||isNaN(km)){toast("Введите план в км");return}await put("corr","s"+st+"-p"+PI[p].i,{stage:st,pos:p,km,doc:$("#crDoc").value.trim(),comment:$("#crCom").value.trim()});toast("Корректировка сохранена");render()}
  else if(a==="crDel"){await del("corr",b.dataset.id);render()}
  else if(a==="sdSave")sdSave();
  else if(a==="sdReset"){const s=Object.assign({},S());delete s.stageDates;await put("settings","main",s);toast("Даты этапов — снова как в контракте");render()}
  else if(a==="parsePaste")parsePaste(textRows($("#pasteBox").value));
  else if(a==="applyPaste")applyPaste();
});
document.addEventListener("input",ev=>{const card=ev.target.closest("#cards .pos");if(card){entryDirty=true;checkCard(card)}
  const rc=ev.target.closest("#revCards .pos");if(rc)revCardSum(rc);
  if(ev.target.id==="glq"){glQ=ev.target.value;$("#glOut").innerHTML=glHtml(glQ)}
  if(ev.target.id==="crStage"||ev.target.id==="crPos")crHint()});
document.addEventListener("change",async ev=>{const t=ev.target;
  if(t.id==="entryDate"){entryDate=clampDate(t.value||entryDate);render()}
  else if(t.id==="revDate"){revDate=clampDate(t.value||revDate);render()}
  else if(t.id==="rpType"){rep.type=t.value;rep.step=null;render()}
  else if(t.id==="rpAnchor"){if(t.value){rep.anchor=clampDate(t.value);render()}}
  else if(t.id==="rpStep"){rep.step=t.value;render()}
  else if(t.id==="rpFrom"){rep.cf=t.value||null;render()}
  else if(t.id==="rpTo"){rep.ct=t.value||null;render()}
  else if(t.id==="rpMonth"){rep.ym=t.value;rep.a=rep.b=null;render()}
  else if(t.id==="rpA"){rep.a=t.value||null;render()}
  else if(t.id==="rpB"){rep.b=t.value||null;render()}
  else if(t.id==="rpDay"){rep.day=t.value||null;render()}
  else if(t.id==="rpStage"){rep.stage=+t.value;render()}
  else if(t.id==="coName"){const v=t.value.trim()||DEF_SETTINGS.company;await put("settings","main",Object.assign({},S(),{company:v}));toast("Название сохранено")}
  else if(t.id==="signPos"||t.id==="signName"){await put("settings","main",Object.assign({},S(),{[t.id]:t.value.trim()}));toast("Подписант сохранён")}
  else if((t.id==="revFile"||t.id==="ppFile"||t.id==="asduFile")&&t.files&&t.files[0]){
    try{const rows=await fileRows(t.files[0],t.id==="revFile"?["асоп","выручк"]:t.id==="ppFile"?["план пасс","пассаж"]:["асду","выгрузк"]);if(!rows)return;
      if(t.id==="revFile")revParse(rows);else if(t.id==="ppFile")ppParse(rows);else parsePaste(rows)}catch(e){toast("Файл не прочитан: "+(e&&e.message||"ошибка"))}}
  else if(t.id==="stageSel"){stageSel=+t.value;render()}
  else if(t.id==="schPos"){$("#schOut").innerHTML=schTable(t.value)}
  else if(t.id==="crStage"||t.id==="crPos")crHint();
  else if(t.id==="sdStage")sdFill();
  else if(t.dataset.act==="lf"||t.id==="fines"||t.id==="stEis"||t.id==="stPaid"){
    const n=stageSel;const st=Object.assign({lf:{}},store.data.stages["s"+n]||{});st.lf=Object.assign({},st.lf);
    if(t.dataset.act==="lf"){const v=parseNum(t.value);if(v==null)delete st.lf[t.dataset.pos];else if(isNaN(v)){toast("Lф — число");return}else st.lf[t.dataset.pos]=v}
    if(t.id==="fines"){const v=parseNum(t.value);st.fines=v==null||isNaN(v)?null:v}
    if(t.id==="stEis")st.eis=t.checked; if(t.id==="stPaid")st.paid=t.checked;
    await put("stages","s"+n,st);render()}
  else if(t.id==="normIn"){const v=parseNum(t.value);if(v==null||isNaN(v)||v<=0||v>100){toast("Норматив — число от 1 до 100");return}await put("settings","main",Object.assign({},S(),{norm:v/100}));toast("Норматив сохранён")}
  else if(t.id==="restoreFile"&&t.files&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(j.app!=="79gh"||!j.data)throw 0;for(const c of COLS)for(const [id,v] of Object.entries(j.data[c]||{}))await put(c,id,v);toast("Данные восстановлены");render()}catch(e){toast("Это не резервная копия приложения")}}
});
function sdChanged(){const L=stageList();const ch=[];L.forEach((s,i)=>{const o=D.stages[i];if(s[0]!==o[0]||s[1]!==o[1])ch.push(`<div class="line"><div class="grow small"><b>Этап ${i+1}: ${ru(s[0])} – ${ru(s[1])}</b><br><span class="muted">по контракту ${ru(o[0])} – ${ru(o[1])}</span></div></div>`)});
  return ch.length?`<div class="lines">${ch.join("")}</div><button class="ghost danger" data-act="sdReset">Вернуть все даты по контракту</button>`:`<p class="small muted" style="margin:0">Сейчас все даты — как в контракте.</p>`}
function sdFill(){const el=$("#sdStage");if(!el)return;const n=+el.value;const [a,b]=stageDates(n);$("#sdStart").value=a;$("#sdEnd").value=b;$("#sdStart").disabled=n!==1;
  $("#sdHint").textContent=(n===1?"":"Начало этапа — следующий день после окончания этапа "+(n-1)+"; чтобы сдвинуть его, поменяйте окончание предыдущего этапа. ")+(n<48?"Этап "+(n+1)+" начнётся со дня после нового окончания.":"Это последний этап контракта.")}
async function sdSave(){const n=+$("#sdStage").value;const st=$("#sdStart").value,en=$("#sdEnd").value;if(!en||(n===1&&!st)){toast("Укажите даты");return}
  const cur=(S().stageDates)||{};const o={start1:cur.start1||null,ends:Object.assign({},cur.ends||{})};
  if(n===1){o.start1=st===D.stages[0][0]?null:st}
  if(en===D.stages[n-1][1])delete o.ends[n];else o.ends[n]=en;
  const L=buildStages(o);
  for(let i=0;i<48;i++){if(L[i][0]>L[i][1]){toast("Этап "+(i+1)+" получается пустым: окончание раньше начала");return}}
  if(L[0][0]<START||L[47][1]>END){toast("Даты должны быть в сроке контракта: 01.12.2026 – 30.11.2028");return}
  if(!o.start1)delete o.start1;
  await put("settings","main",Object.assign({},S(),{stageDates:o}));toast("Даты этапа "+n+" сохранены");render()}
function crHint(){const st=+$("#crStage").value,p=$("#crPos").value;const h=$("#crHint");if(h)h.textContent="План Прил. 3 для этапа "+st+", позиция "+p+": "+fmt((D.plan[st]||{})[p]||0)+" км"}
function route(){const h=(location.hash||"#home").slice(1);const v=["home","entry","stage","rep","ref","more"].includes(h)?h:"home";
  if(view==="entry"&&entryDirty&&v!=="entry")toast("Несохранённые данные дня не записаны");view=v;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
view=(location.hash||"#home").slice(1);if(!["home","entry","stage","rep","ref","more"].includes(view))view="home";
initStore();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
